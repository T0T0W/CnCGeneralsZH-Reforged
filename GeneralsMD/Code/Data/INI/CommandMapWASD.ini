;//////////////////////////////////////////////////////////////////////////////
;FILE: CommandMapWASD.ini (SYSTEM) ////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;
; MASTER COPY - the build copies it to Run/Data/INI/ with CommandMap.ini.
;
; The keys that move when the W A S D camera box is ticked on the Controls page.
; MetaMap::loadWasdBindings copies the finished Modern map - the language's own
; CommandMap.ini with this fork's CommandMap.ini over it - into a list of its
; own and lays this file over that copy, so a block here only has to name what
; changes: every field it leaves out keeps the Modern value.  Legacy input never
; reads this file and the box is grey while Legacy is picked.
;
; The camera keys themselves are not in here.  Scrolling is read as a raw key
; in LookAtXlat.cpp, beside the arrow keys: the meta map holds one key per
; command, so binding W A S D would take the arrows away, and a meta record
; fires its UP only while the modifiers match the ones the key went down with,
; so letting go of W with ctrl held for a control group would leave the camera
; running.
;
; The grid's top row steps over W:
;
;   slot 01 03 05 07 09 11 13   (top row)      Q  E  R  T  Y  U  I
;   slot 02 04 06 08 10 12 14   (bottom row)   Z  X  C  V  B  N  M
;
; and the orders the camera hand took off A and S move one row down, reading
; left to right along it with no modifier on any of them:
;
;   F attack   G stop   H attack move   J hold position   K guard
;
; Idle workers go from I, which slot 13 now wants, to O.

CommandMap COMMAND_SLOT03
  Key = KEY_E
  Transition = DOWN
  Modifiers = NONE
End

CommandMap COMMAND_SLOT05
  Key = KEY_R
  Transition = DOWN
  Modifiers = NONE
End

CommandMap COMMAND_SLOT07
  Key = KEY_T
  Transition = DOWN
  Modifiers = NONE
End

CommandMap COMMAND_SLOT09
  Key = KEY_Y
  Transition = DOWN
  Modifiers = NONE
End

CommandMap COMMAND_SLOT11
  Key = KEY_U
  Transition = DOWN
  Modifiers = NONE
End

CommandMap COMMAND_SLOT13
  Key = KEY_I
  Transition = DOWN
  Modifiers = NONE
End

CommandMap SELECT_NEXT_IDLE_WORKER
  Key = KEY_O
  Transition = DOWN
  Modifiers = NONE
End

CommandMap TOGGLE_FORCEATTACK
  Key = KEY_F
  Transition = DOWN
  Modifiers = NONE
End

CommandMap STOP
  Key = KEY_G
  Transition = DOWN
  Modifiers = NONE
End

CommandMap TOGGLE_ATTACKMOVE
  Key = KEY_H
  Transition = DOWN
  Modifiers = NONE
End

CommandMap HOLD_POSITION
  Key = KEY_J
  Transition = DOWN
  Modifiers = NONE
End

CommandMap TOGGLE_GUARD
  Key = KEY_K
  Transition = DOWN
  Modifiers = NONE
End
